name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  # The only Home Assistant this repository tests against is the one
  # pytest-homeassistant-custom-component pins, which tracks current. hacs.json
  # names an older floor derived from the APIs used and one local run; nothing
  # here proves it, so a bug report from an older release may just be its age.
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.3.0+ requires >= 3.14.2. On anything older, pip
          # resolves pytest-homeassistant-custom-component back to a release
          # pinning a months-old Home Assistant and the suite passes against an
          # API nobody is running.
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest -q
